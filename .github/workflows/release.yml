name: Release firmata (APK + AAB)

# Build di distribuzione: si avvia a mano dal tab Actions, oppure creando
# un tag "v1.2.3". Richiede i secret della chiave di firma: senza, si ferma
# subito con un messaggio chiaro invece di produrre un pacchetto inutilizzabile.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versione mostrata agli utenti (es. 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Numero di build, deve crescere a ogni pubblicazione'
        required: true
        default: '1'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verifica i secret della firma
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Manca RELEASE_KEYSTORE_BASE64. Segui le istruzioni in docs/pubblicazione.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verifica l'Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          [ -d "$SDK" ] || { echo "Android SDK non trovato"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Installa le dipendenze
        run: npm ci

      - name: Verifica i riferimenti nei template
        run: node scripts/check-templates.mjs

      - name: Configura Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android-config
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android-config/google-services.json
          fi

      - name: Genera il bundle web
        env:
          NATIVE_BUILD: "1"
          BUILD_STAMP: ${{ github.sha }}
        run: |
          node scripts/env-from-google-services.mjs
          npx nuxi generate

      # La chiave di firma vive solo qui, nel filesystem effimero del runner.
      - name: Ripristina la chiave di firma
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Prepara la piattaforma Android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android-manifest.mjs

      - name: Imposta versione e numero di build
        run: |
          NAME="${{ github.event.inputs.versionName || github.ref_name }}"
          NAME="${NAME#v}"
          CODE="${{ github.event.inputs.versionCode || github.run_number }}"
          sed -i "s/versionName \".*\"/versionName \"$NAME\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Compila APK e AAB firmati
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-release.log

      # Un pacchetto non firmato si installerebbe solo per sbaglio: meglio fermarsi.
      - name: Verifica che la firma ci sia
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK di release non prodotto"; exit 1; }
          if ! unzip -l "$APK" | grep -qE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "::error::L'APK non risulta firmato"; exit 1
          fi
          echo "APK firmato correttamente"

      - name: Rinomina i pacchetti
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Equilibrio-$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "Equilibrio-$VERSION_NAME.aab"
          ls -la Equilibrio-*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ env.VERSION_NAME }}
          path: |
            Equilibrio-*.apk
            Equilibrio-*.aab
            gradle-release.log
          retention-days: 30

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Equilibrio ${{ env.VERSION_NAME }}
          body: |
            Versione firmata di distribuzione.

            **Equilibrio-${{ env.VERSION_NAME }}.apk** — per installazione diretta.
            **Equilibrio-${{ env.VERSION_NAME }}.aab** — da caricare sul Play Console.
          files: |
            Equilibrio-${{ env.VERSION_NAME }}.apk
            Equilibrio-${{ env.VERSION_NAME }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
